services:
  # 1. FastAPI Machine Learning Microservice
  - type: web
    name: car-price-api
    runtime: docker
    dockerfilePath: ./car-api-deploy/Dockerfile
    dockerContext: ./car-api-deploy
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000

  # 2. React Frontend (Free Static Site on Render CDN)
  - type: static
    name: car-price-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://car-price-api-4kmp.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
